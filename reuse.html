```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reuse</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0b0b;
      color: #ffffff;
      display: flex;
      flex-direction: column;
    }

    header {
      width: 100%;
      padding: 20px;
      text-align: center;
      background: #111111;
      border-bottom: 1px solid #222222;
    }

    header h1 {
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
      flex: 1;
    }

    .title {
      text-align: center;
      margin-bottom: 35px;
    }

    .title h2 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .title p {
      color: #aaa;
      font-size: 16px;
    }

    .reuse-area {
      width: 100%;
      min-height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #252525;
      border-radius: 15px;
      background: #111111;
      text-align: center;
    }

    .reuse-area h3 {
      font-size: 26px;
      color: #ffffff;
    }

    footer {
      width: 100%;
      padding: 20px;
      text-align: center;
      background: #111111;
      border-top: 1px solid #222222;
      color: #888;
      font-size: 14px;
    }

    .back-btn {
      display: inline-block;
      margin-top: 25px;
      padding: 12px 25px;
      border-radius: 8px;
      background: #ffffff;
      color: #000000;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .back-btn:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <header>
    <h1>REUSE</h1>
  </header>

  <main class="container">

    <div class="title">
      <h2>Reuse</h2>
      <p>Área exclusiva Reuse</p>
    </div>

    <div class="reuse-area">
      <div>
        <h3>REUSE</h3>

        <a class="back-btn" href="index.html">
          Voltar
        </a>
      </div>
    </div>

  </main>

  <footer>
    © 2026 Reuse
  </footer>

</body>
</html>
